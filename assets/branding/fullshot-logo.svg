<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#373A40"/>
      <stop offset="50%" stop-color="#2B2E33"/>
      <stop offset="100%" stop-color="#1F2125"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8297AC"/>
      <stop offset="50%" stop-color="#6D8196"/>
      <stop offset="100%" stop-color="#556677"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBCBCB"/>
    </linearGradient>
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFF0"/>
      <stop offset="100%" stop-color="#FFFFE3"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#4A4A4A" stroke-width="6" filter="url(#softShadow)"/>

  <!-- Subtle Accent Ring -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="none" stroke="url(#slateGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Outer Camera / Viewport Frame Corners -->
  <!-- Top-Left Corner -->
  <path d="M 120 180 L 120 148 Q 120 120 148 120 L 180 120" fill="none" stroke="url(#slateGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-Right Corner -->
  <path d="M 332 120 L 364 120 Q 392 120 392 148 L 392 180" fill="none" stroke="url(#slateGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-Left Corner -->
  <path d="M 120 332 L 120 364 Q 120 392 148 392 L 180 392" fill="none" stroke="url(#slateGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-Right Corner -->
  <path d="M 332 392 L 364 392 Q 392 392 392 364 L 392 332" fill="none" stroke="url(#slateGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Shutter / Aperture Disc -->
  <circle cx="256" cy="256" r="88" fill="#24262B" stroke="#4A4A4A" stroke-width="4"/>
  <circle cx="256" cy="256" r="76" fill="url(#slateGrad)" opacity="0.18"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="url(#silverGrad)" stroke-width="8" stroke-dasharray="14 8"/>

  <!-- Core Lens / Flash Highlight -->
  <circle cx="256" cy="256" r="48" fill="url(#slateGrad)" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="256" r="40" fill="#6D8196"/>

  <!-- Crosshair Focus Points -->
  <line x1="256" y1="172" x2="256" y2="196" stroke="url(#ivoryGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="316" x2="256" y2="340" stroke="url(#ivoryGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="172" y1="256" x2="196" y2="256" stroke="url(#ivoryGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="316" y1="256" x2="340" y2="256" stroke="url(#ivoryGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Core Lens Center Dot (Warm Ivory) -->
  <circle cx="256" cy="256" r="16" fill="url(#ivoryGrad)"/>
  <circle cx="248" cy="248" r="5" fill="#FFFFFF" opacity="0.9"/>
</svg>
